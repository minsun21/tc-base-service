spring:
  application:
    name: tc-service-base
  profiles:
    active: local

server:
  port: 8080

---
# ── local ──
spring:
  config:
    activate:
      on-profile: local

  datasource:
    tc:
      url: jdbc:oracle:thin:@//localhost:1521/tcdb
      username: tc_user
      password: local_password
      driver-class-name: oracle.jdbc.OracleDriver
    erp:
      url: jdbc:oracle:thin:@//localhost:1521/erpdb
      username: erp_user
      password: local_password
      driver-class-name: oracle.jdbc.OracleDriver

logging:
  level:
    root: info
    com.demo.tcservicebase: debug

---
# ── dev ──
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    tc:
      url: jdbc:oracle:thin:@//dev-db-host:1521/tcdb
      username: tc_user
      password: ${TC_DB_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
    erp:
      url: jdbc:oracle:thin:@//dev-db-host:1521/erpdb
      username: erp_user
      password: ${ERP_DB_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver

logging:
  level:
    root: info
    com.demo.tcservicebase: debug

---
# ── prod ──
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    tc:
      url: jdbc:oracle:thin:@//prod-db-host:1521/tcdb
      username: tc_user
      password: ${TC_DB_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
    erp:
      url: jdbc:oracle:thin:@//prod-db-host:1521/erpdb
      username: erp_user
      password: ${ERP_DB_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver

logging:
  level:
    root: warn
